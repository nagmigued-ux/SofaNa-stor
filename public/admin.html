<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SofaNA Admin</title><style>
body{font-family:Arial;background:#faf7f5;margin:0;color:#222}.wrap{max-width:1100px;margin:auto;padding:25px}.box{background:#fff;border:1px solid #eee;border-radius:10px;padding:20px;margin:15px 0}input,select{padding:11px;border:1px solid #ddd;border-radius:6px;margin:4px}.btn{padding:10px 18px;border:0;background:#171717;color:#fff;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>SofaNA — لوحة الإدارة</h1><div class="box"><label>مفتاح الإدارة <input id="key" type="password" placeholder="ADMIN_KEY"></label><button class="btn" onclick="login()">دخول</button><span id="msg"></span></div><div id="app" style="display:none"><div class="grid"><section class="box"><h2>إضافة منتج</h2><input id="pn" placeholder="اسم المنتج"><input id="pc" placeholder="القسم"><input id="pp" type="number" placeholder="السعر"><input id="pi" placeholder="رابط/اسم الصورة"><button class="btn" onclick="addProduct()">إضافة</button></section><section class="box"><h2>إحصاءات سريعة</h2><p id="stats">—</p></section></div><section class="box"><h2>الطلبات</h2><div id="orders"></div></section><section class="box"><h2>المنتجات</h2><div id="products"></div></section></div></div><script>
let K="";
async function api(url,opt={}){opt.headers={...(opt.headers||{}),"x-admin-key":K,"Content-Type":"application/json"};let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error||"خطأ");return d}
async function login(){K=document.querySelector("#key").value;try{await api("/api/admin/orders");document.querySelector("#app").style.display="block";load()}catch(e){document.querySelector("#msg").textContent=" المفتاح غير صحيح"}}
async function load(){let [o,p]=await Promise.all([api("/api/admin/orders"),api("/api/admin/products")]);document.querySelector("#stats").textContent=`عدد الطلبات: ${o.length} — عدد المنتجات: ${p.filter(x=>x.active).length}`;document.querySelector("#orders").innerHTML=o.length?`<table><tr><th>الطلب</th><th>العميل</th><th>الولاية</th><th>المجموع</th><th>الحالة</th></tr>${o.map(x=>`<tr><td>${x.id}</td><td>${x.customer}<br>${x.phone}</td><td>${x.wilaya}</td><td>${x.total.toLocaleString()} دج</td><td><select onchange="status('${x.id}',this.value)"><option ${x.status==="جديد"?"selected":""}>جديد</option><option ${x.status==="تم التأكيد"?"selected":""}>تم التأكيد</option><option ${x.status==="تم الشحن"?"selected":""}>تم الشحن</option><option ${x.status==="مكتمل"?"selected":""}>مكتمل</option><option ${x.status==="ملغى"?"selected":""}>ملغى</option></select></td></tr>`).join("")}</table>`:"لا توجد طلبات";document.querySelector("#products").innerHTML=`<table><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>نشط</th></tr>${p.map(x=>`<tr><td>${x.name}</td><td>${x.category}</td><td>${x.price}</td><td><button onclick="toggle(${x.id},${!x.active})">${x.active?"إخفاء":"إظهار"}</button></td></tr>`).join("")}</table>`}
async function status(id,s){await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status:s})});load()}
async function toggle(id,a){await api("/api/admin/products/"+id,{method:"PATCH",body:JSON.stringify({active:a})});load()}
async function addProduct(){await api("/api/admin/products",{method:"POST",body:JSON.stringify({name:pn.value,category:pc.value,price:Number(pp.value),image:pi.value})});pn.value=pc.value=pp.value=pi.value="";load()}
</script></body></html>
